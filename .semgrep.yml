rules:
  # OWASP Top 10 Security Rules Configuration
  # This configuration targets both TypeScript/React and Java code

  # A01:2021 - Broken Access Control
  - id: spring-security-disabled
    patterns:
      - pattern: |
          @EnableWebSecurity
          ...
          .authorizeRequests().anyRequest().permitAll()
    message: Security check disabled - all requests are permitted without authentication
    languages: [java]
    severity: ERROR
    metadata:
      owasp: "A01:2021 - Broken Access Control"
      cwe: "CWE-285: Improper Authorization"

  - id: insecure-cors-config
    patterns:
      - pattern: |
          cors().allowedOrigins("*")
    message: Insecure CORS configuration allows any origin
    languages: [java]
    severity: ERROR
    metadata:
      owasp: "A01:2021 - Broken Access Control"

  # A02:2021 - Cryptographic Failures
  - id: hardcoded-secret
    pattern-either:
      - pattern: |
          const $KEY = "$SECRET"
      - pattern: |
          private static final String $KEY = "$SECRET";
    message: Potential hardcoded secret detected
    languages: [typescript, javascript, java]
    severity: ERROR
    metadata:
      owasp: "A02:2021 - Cryptographic Failures"
      cwe: "CWE-798: Use of Hard-coded Credentials"

  - id: weak-crypto-algorithm
    pattern-either:
      - pattern: Cipher.getInstance("DES")
      - pattern: Cipher.getInstance("MD5")
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA1")
    message: Weak cryptographic algorithm detected
    languages: [java]
    severity: ERROR
    metadata:
      owasp: "A02:2021 - Cryptographic Failures"
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"

  # A03:2021 - Injection
  - id: sql-injection-risk
    pattern-either:
      - pattern: |
          $QUERY = "... " + $INPUT + "..."
      - pattern: |
          String $SQL = "..." + $VAR + "..."
    message: Potential SQL injection - use parameterized queries
    languages: [java, typescript, javascript]
    severity: ERROR
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-89: SQL Injection"

  - id: command-injection-risk
    pattern-either:
      - pattern: Runtime.getRuntime().exec($INPUT)
      - pattern: ProcessBuilder($INPUT)
    message: Potential command injection vulnerability
    languages: [java]
    severity: ERROR
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-78: OS Command Injection"

  - id: dangerouslySetInnerHTML-xss
    patterns:
      - pattern: |
          dangerouslySetInnerHTML={{__html: $VAR}}
    message: XSS vulnerability - avoid dangerouslySetInnerHTML with user input
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-79: Cross-site Scripting (XSS)"

  - id: eval-usage
    pattern-either:
      - pattern: eval($VAR)
      - pattern: Function($VAR)
      - pattern: setTimeout($VAR, ...)
      - pattern: setInterval($VAR, ...)
    message: Dangerous use of eval or dynamic code execution
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"

  # A04:2021 - Insecure Design
  - id: missing-rate-limiting
    patterns:
      - pattern: |
          @PostMapping(...)
          public $TYPE login(...) { ... }
      - pattern-not: |
          @RateLimited
    message: Authentication endpoint should have rate limiting
    languages: [java]
    severity: WARNING
    metadata:
      owasp: "A04:2021 - Insecure Design"

  # A05:2021 - Security Misconfiguration
  - id: debug-mode-enabled
    pattern-either:
      - pattern: |
          debug: true
      - pattern: |
          spring.profiles.active=dev
    message: Debug mode should not be enabled in production
    languages: [yaml, properties]
    severity: WARNING
    metadata:
      owasp: "A05:2021 - Security Misconfiguration"

  - id: csrf-disabled
    patterns:
      - pattern: |
          csrf().disable()
    message: CSRF protection is disabled
    languages: [java]
    severity: ERROR
    metadata:
      owasp: "A05:2021 - Security Misconfiguration"
      cwe: "CWE-352: Cross-Site Request Forgery"

  # A06:2021 - Vulnerable and Outdated Components
  # (Handled by npm audit and dependency-check-maven)

  # A07:2021 - Identification and Authentication Failures
  - id: weak-password-validation
    patterns:
      - pattern: |
          password.length() >= 6
    message: Password length requirement is too weak (minimum should be 8-12 characters)
    languages: [java, typescript, javascript]
    severity: WARNING
    metadata:
      owasp: "A07:2021 - Identification and Authentication Failures"
      cwe: "CWE-521: Weak Password Requirements"

  - id: jwt-no-expiration
    patterns:
      - pattern: |
          Jwts.builder()...sign($KEY)
      - pattern-not: |
          .setExpiration(...)
    message: JWT token should have an expiration time
    languages: [java]
    severity: ERROR
    metadata:
      owasp: "A07:2021 - Identification and Authentication Failures"

  - id: insecure-session-management
    patterns:
      - pattern: |
          localStorage.setItem("token", $TOKEN)
    message: Storing authentication tokens in localStorage is insecure (use httpOnly cookies)
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      owasp: "A07:2021 - Identification and Authentication Failures"
      cwe: "CWE-922: Insecure Storage of Sensitive Information"

  # A08:2021 - Software and Data Integrity Failures
  - id: insecure-deserialization
    pattern-either:
      - pattern: ObjectInputStream($VAR).readObject()
      - pattern: JSON.parse($UNTRUSTED_INPUT)
    message: Potentially insecure deserialization of untrusted data
    languages: [java, typescript, javascript]
    severity: WARNING
    metadata:
      owasp: "A08:2021 - Software and Data Integrity Failures"
      cwe: "CWE-502: Deserialization of Untrusted Data"

  # A09:2021 - Security Logging and Monitoring Failures
  - id: sensitive-data-in-logs
    pattern-either:
      - pattern: |
          log.$METHOD(..., password, ...)
      - pattern: |
          console.log(..., password, ...)
      - pattern: |
          logger.$METHOD("... password: " + $VAR)
    message: Sensitive data (password) should not be logged
    languages: [java, typescript, javascript]
    severity: ERROR
    metadata:
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"

  - id: catch-exception-without-logging
    patterns:
      - pattern: |
          catch ($E) { }
    message: Exception caught but not logged - security events should be logged
    languages: [java, typescript, javascript]
    severity: WARNING
    metadata:
      owasp: "A09:2021 - Security Logging and Monitoring Failures"

  # A10:2021 - Server-Side Request Forgery (SSRF)
  - id: ssrf-vulnerability
    pattern-either:
      - pattern: |
          fetch($USER_INPUT)
      - pattern: |
          axios.get($USER_INPUT)
      - pattern: |
          new URL($USER_INPUT)
      - pattern: |
          RestTemplate.getForObject($USER_INPUT, ...)
    message: Potential SSRF vulnerability - validate and sanitize URL input
    languages: [typescript, javascript, java]
    severity: ERROR
    metadata:
      owasp: "A10:2021 - Server-Side Request Forgery"
      cwe: "CWE-918: Server-Side Request Forgery"

  # Additional Security Best Practices
  - id: path-traversal
    pattern-either:
      - pattern: |
          new File($USER_INPUT)
      - pattern: |
          Paths.get($USER_INPUT)
      - pattern: |
          fs.readFile($USER_INPUT, ...)
    message: Potential path traversal vulnerability - validate file paths
    languages: [java, typescript, javascript]
    severity: ERROR
    metadata:
      cwe: "CWE-22: Path Traversal"

  - id: insecure-random
    pattern-either:
      - pattern: new Random()
      - pattern: Math.random()
    message: Use SecureRandom for security-sensitive operations
    languages: [java, typescript, javascript]
    severity: WARNING
    metadata:
      cwe: "CWE-330: Use of Insufficiently Random Values"
